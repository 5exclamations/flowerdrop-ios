<?xml version="1.0" encoding="UTF-8"?>
<!--
  Знак без плитки: тот же тюльпан, что в иконке, но на прозрачном фоне.
  Нужен для launch screen — там фон задаёт цвет bg из дизайн-системы.
  viewBox обрезан по знаку с полями, чтобы масштабирование было предсказуемым.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="162 172 700 700" width="700" height="700">
  <g transform="translate(0 -38)">
    <g fill="#1F3D2B">
      <!-- бутон: три доли, центральная выше боковых -->
      <path d="M512 248
               C 494 306 468 334 442 344
               C 424 306 400 292 382 312
               C 364 348 372 452 388 512
               C 408 588 452 638 512 656
               C 572 638 616 588 636 512
               C 652 452 660 348 642 312
               C 624 292 600 306 582 344
               C 556 334 530 306 512 248 Z"/>

      <!-- стебель -->
      <path d="M512 646 L512 872" stroke="#1F3D2B" stroke-width="30" stroke-linecap="round" fill="none"/>

      <!-- лист слева -->
      <path d="M498 806
               C 452 800 402 760 380 700
               C 442 686 490 730 504 792 Z"/>

      <!-- лист справа, выше — асимметрия, чтобы знак не был зеркальным -->
      <path d="M526 742
               C 572 734 620 692 640 630
               C 578 618 532 664 520 728 Z"/>
    </g>
  </g>
</svg>
