name: FlowerDrop
options:
  bundleIdPrefix: com.texa
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  FlowerDrop:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FlowerDrop
        excludes:
          - "Info.plist"
          - "Info-Debug.plist"
    entitlements:
      path: FlowerDrop/FlowerDrop.entitlements
      properties:
        # Вход через Apple. Без этого права кнопка на устройстве отвечает
        # ошибкой авторизации, а не входом.
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.texa.flowerdrop
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # UILaunchScreen задан в plist вручную — генерацией его затёрло бы.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
      configs:
        # Адрес бэкенда и ATS-исключение задаёт конфигурация, а не код.
        # Debug смотрит на localhost по HTTP, Release — только HTTPS.
        Debug:
          INFOPLIST_FILE: FlowerDrop/Info-Debug.plist
        Release:
          INFOPLIST_FILE: FlowerDrop/Info.plist
